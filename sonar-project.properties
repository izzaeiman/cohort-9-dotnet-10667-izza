# SonarQube Project Configuration
sonar.projectKey=task-management-tool
sonar.projectName=Task Management Tool
sonar.projectVersion=1.0

# Source and Test Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/wwwroot/**,Backend/Migrations/**,**/coverage/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Coverage configuration for .NET
sonar.cs.opencover.reportsPaths=Backend.Tests/TestResults/**/coverage.opencover.xml
sonar.cs.vscoveragexml.reportsPaths=Backend.Tests/TestResults/**/coverage.cobertura.xml
sonar.coverage.exclusions=**/*Tests.cs,Backend/Migrations/**

# C# settings
sonar.dotnet.excludeTestProjects=true

# JavaScript/TypeScript settings
