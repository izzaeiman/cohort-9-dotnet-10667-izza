# SonarQube Project Configuration
sonar.projectKey=task-management-tool
sonar.projectName=Task Management Tool
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000

# Path to sources
sonar.sources=Backend,frontend/src

# Path to tests
sonar.tests=Backend.Tests

# Source and Test Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/wwwroot/**,Backend/Migrations/**
sonar.test.inclusions=**/*Tests.cs

# Source encoding
sonar.sourceEncoding=UTF-8

# C# settings
sonar.dotnet.excludeTestProjects=true

# JavaScript/TypeScript settings
sonar.typescript.tsconfigPath=frontend/tsconfig.json
