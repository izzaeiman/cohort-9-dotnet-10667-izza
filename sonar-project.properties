# SonarQube Project Configuration
sonar.projectKey=task-management-tool
sonar.projectName=Task Management Tool
sonar.projectVersion=1.0

# Source and Test Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/wwwroot/**,Backend/Migrations/**,**/coverage/**,**/*.py

# Source encoding
sonar.sourceEncoding=UTF-8

# Coverage configuration for .NET
sonar.cs.opencover.reportsPaths=Backend.Tests/TestResults/coverage.opencover.xml
sonar.coverage.exclusions=**/*Tests.cs,Backend/Migrations/**,**/*.test.ts,**/*.test.tsx

# C# settings
sonar.dotnet.excludeTestProjects=true

# JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
sonar.sources=Backend,frontend/src
sonar.tests=Backend.Tests,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*Tests.cs
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*Tests.cs
